spring.application.name=crm-api

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=HikariCP-Dev
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.default_schema=public

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000

app.upload-dir=./uploads

logging.level.root=INFO
logging.level.com.reactivosdelvalle.crm=INFO
logging.level.org.springframework.security=INFO
# IMPORTANTE: nunca dejar org.hibernate.SQL=DEBUG ni org.hibernate.orm.jdbc.bind=TRACE
# en produccion: exponen todos los parametros de las queries (datos de clientes,
# emails, hashes). Activarlos SOLO temporalmente para depurar y luego revertir.

# --- Scheduler: respaldo semanal (Regla 11) ---
app.respaldo.cron=0 0 1 * * SUN
app.respaldo.retencion-dias=30

# --- Scheduler: alertas de inactividad diarias (Regla 2) ---
app.inactividad.cron=0 0 7 * * *
app.inactividad.horas=24

