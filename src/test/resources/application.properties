# Configuracion de tests — reemplaza main/application.properties en el classpath.
# La datasource la inyecta Testcontainers via @ServiceConnection; no necesitamos
# spring.datasource.* aqui. Todo lo demas que necesita la app para levantar va abajo.

# --- JWT (main/application.properties define jwt.secret=${JWT_SECRET} pero como
# este archivo REEMPLAZA al main en classpath de test, ponemos los valores directos) ---
jwt.secret=test-secret-para-tests-minimo-256-bits-de-longitud-para-hmac-sha256-algoritmo
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000

# --- JPA / Flyway ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- Schedulers deshabilitados: '-' es el valor especial de Spring para @Scheduled ---
app.vencimiento.cron=-
app.respaldo.cron=-
app.inactividad.cron=-
app.recordatorio.cron=-
app.tickets.reintento-cron=-

# --- WhatsApp deshabilitado en tests (fallback a log) ---
app.whatsapp.enabled=false
app.whatsapp.account-sid=test-sid
app.whatsapp.auth-token=test-token
app.whatsapp.from=whatsapp:+14155238886

# --- Integracion tickets (deshabilitada) ---
app.tickets.enabled=false
app.tickets.api-key=test-api-key-local

# --- Mail deshabilitado ---
app.mail.enabled=false

# --- Upload dir / storage ---
app.upload-dir=./uploads-test
app.storage.tipo=local
app.storage.ruta-local=./uploads-test
app.storage.max-tamano-mb=30
app.storage.tipos-permitidos=pdf,doc,docx,xls,xlsx,jpg,jpeg,png,gif,zip
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB

# --- Silenciar logs irrelevantes ---
logging.level.root=WARN
logging.level.com.reactivosdelvalle=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=WARN
logging.file.name=
