# Perfil LOCAL: apunta al PostgreSQL del docker-compose.yml
# Activar con: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
#
# Prerequisito: docker-compose up -d (desde C:\GitHub\Reaccion-CMR)

spring.datasource.url=jdbc:postgresql://localhost:5433/crm_reactivos
spring.datasource.username=crm_user
spring.datasource.password=crm_dev_2024

# JWT para desarrollo local (NO usar en producción)
jwt.secret=clave-local-desarrollo-no-usar-en-produccion-minimo-256-bits-hmac-sha256-suficiente

# Schedulers deshabilitados en local para no interferir con pruebas manuales
app.respaldo.cron=-
app.inactividad.cron=-
app.tickets.reintento-cron=-

# Mostrar queries SQL en local para depuración (NUNCA en producción)
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
