# ============================================================
# application-prod.properties
# Sobreescribe application.properties cuando el perfil "prod" está activo.
# Activar: java -jar crm-api.jar --spring.profiles.active=prod
#          o variable de entorno: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# --- Errores: nunca exponer mensajes internos al cliente ---
server.error.include-message=never
server.error.include-binding-errors=never

# --- CORS: solo los dominios autorizados de la empresa ---
# Reemplazá con la URL real del frontend desplegado.
app.cors.allowed-origins=https://crm.reactivosdelvalle.com

# --- URL pública del frontend para los correos de reseteo de contraseña ---
app.mail.reset-url-base=https://crm.reactivosdelvalle.com/restablecer-password
app.mail.enabled=true

# --- Sistema de tickets ---
app.tickets.url=https://tickets.reactivosdelvalle.com/api/clientes

# --- WhatsApp habilitado ---
app.whatsapp.enabled=true

# --- Pool de conexiones para producción ---
spring.datasource.hikari.pool-name=HikariCP-Prod
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# --- Variables requeridas por entorno (NO poner valores aquí, usar variables de entorno) ---
# SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/crm_db
# SPRING_DATASOURCE_USERNAME=crm_user
# SPRING_DATASOURCE_PASSWORD=<contraseña segura>
# JWT_SECRET=<mínimo 64 caracteres aleatorios>
# APP_WHATSAPP_ACCOUNT_SID=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# APP_WHATSAPP_AUTH_TOKEN=<token de Twilio>
# APP_TICKETS_API_KEY=<clave de integración con el sistema de tickets>
