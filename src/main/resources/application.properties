spring.application.name=crm-api

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=HikariCP-Dev
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.default_schema=public

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000

app.upload-dir=./uploads

# --- Correo: recuperacion de contrasena ---
# false = modo desarrollo (el enlace queda en el log); true = envia por SMTP real
app.mail.enabled=false
app.mail.from=no-reply@reactivosdelvalle.com
app.mail.reset-url-base=http://192.168.20.36:5173/restablecer-password
# Para activar SMTP real, descomentar y completar (ej. Gmail con contrasena de aplicacion):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=tu-correo@gmail.com
# spring.mail.password=tu-contrasena-de-aplicacion
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# --- Logging profesional ---
# Consola: color; Archivo: logs/crm-api.log con rotacion diaria/10MB, 30 dias de retencion
logging.level.root=INFO
logging.level.com.reactivosdelvalle.crm=INFO
logging.level.org.springframework.security=INFO

logging.file.name=logs/crm-api.log
logging.logback.rollingpolicy.file-name-pattern=logs/crm-api-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=200MB

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(${LOG_LEVEL_PATTERN:-%-5level}){faint} %clr([%thread]){magenta} %clr([%X{reqId:---------}]){cyan} %clr(%logger{42}){cyan} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{reqId:---------}] %logger{42} - %msg%n

# IMPORTANTE: nunca dejar org.hibernate.SQL=DEBUG ni org.hibernate.orm.jdbc.bind=TRACE
# en produccion: exponen todos los parametros de las queries (datos de clientes,
# emails, hashes). Activarlos SOLO temporalmente para depurar y luego revertir.

# --- Scheduler: respaldo semanal (Regla 11) ---
app.respaldo.cron=0 0 1 * * SUN
app.respaldo.retencion-dias=30

# --- Scheduler: alertas de inactividad diarias (Regla 2) ---
app.inactividad.cron=0 0 7 * * *
app.inactividad.horas=24

# --- Integracion: sistema de tickets (Next.js) ---
# enabled=false mientras no exista el otro sistema desplegado; los botones responden
# con TICKETS_DESHABILITADO. El envio es manual (boton) y falla con reintento automatico.
app.tickets.enabled=false
app.tickets.url=http://localhost:3000/api/clientes
# En produccion, sobreescribir por variable de entorno: APP_TICKETS_API_KEY
app.tickets.api-key=${APP_TICKETS_API_KEY:cambiar-en-produccion}
app.tickets.reintento-cron=0 */5 * * * *
app.tickets.max-reintentos=5
app.tickets.connect-timeout-ms=5000
app.tickets.read-timeout-ms=10000

# --- CORS: origenes permitidos ---
# En local: puertos del dev server
# En produccion: sobreescribir con variable de entorno APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://192.168.20.36:5173,https://reaccioncrm-frontend.vercel.app
